openapi: 3.1.0
info:
  title: nextStop Candidate Search API
  version: 1.0.0-draft
  description: |
    Draft architecture-gate contract. The backend performs exact route-corridor
    and charging-data filtering. MapKit on iOS calculates actual driving distance,
    applies the exact selected distance range, checks the selected food chain, and
    performs final distance-only ranking.
servers:
  - url: https://api.example.invalid
paths:
  /v1/charging-parks/search:
    post:
      operationId: searchChargingParkCandidates
      summary: Return a stable page of route-corridor charging-park candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Stable candidate page; this is not the final ranked list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Cursor does not belong to the supplied snapshot/request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No valid charging-data projection is available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  responses:
    BadRequest:
      description: Invalid route or criteria.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SearchRequest:
      type: object
      additionalProperties: false
      required: [requestId, route, criteria]
      properties:
        requestId:
          type: string
          format: uuid
          description: Fresh per-operation identifier; never a device/user ID.
        route:
          $ref: '#/components/schemas/RouteLineString'
        criteria:
          $ref: '#/components/schemas/SearchCriteria'
        page:
          type: object
          additionalProperties: false
          properties:
            snapshotToken:
              type: string
              maxLength: 512
            cursor:
              type: string
              maxLength: 512
          description: Omit both fields on the first page; echo server values later.
    RouteLineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          minItems: 2
          maxItems: 20000
          items:
            type: array
            prefixItems:
              - type: number
                minimum: -180
                maximum: 180
                description: Longitude.
              - type: number
                minimum: -90
                maximum: 90
                description: Latitude.
            minItems: 2
            maxItems: 2
    SearchCriteria:
      type: object
      additionalProperties: false
      required:
        - distanceRangeMeters
        - minimumChargingPoints
        - minimumPowerKW
      properties:
        distanceRangeMeters:
          oneOf:
            - $ref: '#/components/schemas/Range15To50'
            - $ref: '#/components/schemas/Range50To100'
            - $ref: '#/components/schemas/Range100To150'
          description: Used for safe batching; exact filtering occurs on iOS.
        minimumChargingPoints:
          type: integer
          enum: [2, 4, 6, 8, 10, 12, 16, 20]
          description: Applied after EVSEs below minimumPowerKW are removed and the remainder is deduplicated.
        minimumPowerKW:
          type: integer
          enum: [11, 22, 50, 100, 150, 200, 250, 300, 350, 400]
          description: Applied to each EVSE before operator counts and minimumChargingPoints. Availability remains informational.
        foodChain:
          type: [string, 'null']
          enum: [null, mcdonalds, burger_king, kfc, subway]
          description: Echo/context only in MVP; MapKit on iOS applies the POI filter.
    Range15To50:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { const: 15000 }
        maximum: { const: 50000 }
    Range50To100:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { const: 50000 }
        maximum: { const: 100000 }
    Range100To150:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { const: 100000 }
        maximum: { const: 150000 }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [snapshotToken, candidates, coverage, generatedAt]
      properties:
        snapshotToken:
          type: string
        nextCursor:
          type: [string, 'null']
        generatedAt:
          type: string
          format: date-time
        candidates:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChargingParkCandidate'
        coverage:
          $ref: '#/components/schemas/Coverage'
    ChargingParkCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - coordinate
        - navigationCoordinate
        - distanceFromRouteMeters
        - straightLineLowerBoundMeters
        - chargingPoints
        - availability
        - maximumPowerKW
        - operators
        - operatorChargingPoints
        - sources
        - dataUpdatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        coordinate: { $ref: '#/components/schemas/Coordinate' }
        navigationCoordinate: { $ref: '#/components/schemas/Coordinate' }
        distanceFromRouteMeters: { type: integer, minimum: 0, maximum: 5000 }
        preliminaryRouteProgressMeters:
          type: integer
          minimum: 0
          description: Never display or treat as actual driving distance.
        straightLineLowerBoundMeters: { type: integer, minimum: 0 }
        chargingPoints:
          type: integer
          minimum: 1
          description: Deduplicated EVSEs meeting the request's minimumPowerKW.
        availability: { $ref: '#/components/schemas/ParkAvailability' }
        maximumPowerKW:
          type: integer
          minimum: 1
          description: Maximum power among the EVSEs included in this request-scoped candidate.
        operators:
          type: array
          uniqueItems: true
          items: { type: string }
        operatorChargingPoints:
          type: array
          minItems: 1
          description: Deduplicated EVSEs meeting minimumPowerKW per included operator; the sum equals chargingPoints.
          items:
            $ref: '#/components/schemas/OperatorChargingPoints'
        sources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SourceSummary' }
        dataUpdatedAt: { type: string, format: date-time }
    OperatorChargingPoints:
      type: object
      additionalProperties: false
      required: [name, chargingPoints]
      properties:
        name: { type: string, minLength: 1 }
        chargingPoints: { type: integer, minimum: 1 }
    Coordinate:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    ParkAvailability:
      type: object
      additionalProperties: false
      required:
        - knownAvailable
        - knownUnavailable
        - unknown
        - total
        - complete
      properties:
        knownAvailable: { type: integer, minimum: 0 }
        knownUnavailable: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        complete: { type: boolean }
        observedAt: { type: [string, 'null'], format: date-time }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [id, name, qualityTier, staticObservedAt]
      properties:
        id: { type: string }
        name: { type: string }
        qualityTier:
          type: string
          enum: [operator, authority, open_data, community]
        staticObservedAt: { type: string, format: date-time }
        liveObservedAt: { type: [string, 'null'], format: date-time }
    Coverage:
      type: object
      additionalProperties: false
      required: [status, activeSources, unavailableSources, projectionUpdatedAt]
      properties:
        status:
          type: string
          enum: [complete, degraded, stale]
        activeSources:
          type: array
          items: { type: string }
        unavailableSources:
          type: array
          items: { type: string }
        projectionUpdatedAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, errorId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        errorId: { type: string, format: uuid }
