limit_req_zone $binary_remote_addr zone=nextstop_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.nextstop.tech;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.nextstop.tech;
    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/api.nextstop.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nextstop.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 5m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location /v1/ {
        limit_req zone=nextstop_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}
