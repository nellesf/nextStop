# Included at http scope. Only fixed labels and generated IDs reach this format.
map $uri $nextstop_diagnostic_route {
    default unknown;
    /health health;
    /v1/charging-parks/search charging_park_search;
    /v1/error-reports user_error_report;
    /v1/auth/app-attest/challenge app_attest_challenge;
    /v1/auth/app-attest/attest app_attest_attestation;
    /v1/auth/app-attest/assert app_attest_assertion;
}

map $status $nextstop_log_error {
    default 0;
    ~^[45] 1;
}

map $status $nextstop_edge_error_category {
    default other_error;
    400 invalid_request;
    401 unauthorized;
    403 forbidden;
    404 not_found;
    408 request_timeout;
    413 body_too_large;
    414 uri_too_long;
    429 capacity_limited;
    499 client_closed;
    500 server_error;
    502 upstream_failure;
    503 unavailable;
    504 upstream_timeout;
}

# This is a response header from the local API, never a client-supplied ID.
map $upstream_http_x_request_id $nextstop_upstream_request_id {
    default "";
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $upstream_http_x_request_id;
}

log_format nextstop_diagnostic escape=json
    '{"event":"http_edge_error","timestamp":"$time_iso8601",'
    '"route":"$nextstop_diagnostic_route","edgeRequestId":"$request_id",'
    '"upstreamRequestId":"$nextstop_upstream_request_id","status":$status,'
    '"durationSeconds":$request_time,"errorCategory":"$nextstop_edge_error_category"}';
