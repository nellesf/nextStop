limit_req_zone $binary_remote_addr zone=nextstop_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.nextstop.tech;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        return 426 "HTTPS is required.\n";
    }
}
