# Rendered only after the candidate passed its private readiness/search gates.
upstream nextstop_api { server 127.0.0.1:__NEXTSTOP_API_PORT__; keepalive 16; }
upstream nextstop_auth { server 127.0.0.1:__NEXTSTOP_AUTH_PORT__; keepalive 8; }

include /etc/nginx/nextstop-request-diagnostics.conf;

limit_req_zone $binary_remote_addr zone=nextstop_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __NEXTSTOP_DOMAIN__;
    server_tokens off;
    access_log /var/log/nextstop/nginx-errors.jsonl nextstop_diagnostic if=$nextstop_log_error;
    add_header X-Edge-Request-ID $request_id always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /ready {
        proxy_pass http://nextstop_api/ready;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location = /ready/auth {
        proxy_pass http://nextstop_auth/ready;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location = /health {
        proxy_pass http://nextstop_api/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        return 426 "HTTPS is required.\n";
    }
}
