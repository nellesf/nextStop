name: CarPlay Screenshots

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Capture saved profiles or result and place selection screens
        type: choice
        options:
          - profiles
          - results
        default: profiles
      reuse_run_id:
        description: Optional run containing a verified main build artifact
        type: string
        default: ''
      reuse_sha256:
        description: SHA-256 of that run's CarPlayBuild.tar.gz
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: carplay-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Probe the native CarPlay display
        run: python3 scripts/carplay-capture/preflight.py
      - name: Save verified display before app capture
        uses: actions/upload-artifact@v7
        with:
          name: carplay-display-preflight
          path: CarPlay-Captures/
          retention-days: 7
      - name: Check out unchanged main app
        uses: actions/checkout@v7
        with:
          ref: 5fe2fa2332d66d2499fc679617855d41cb0111be
          path: screenshot-app
      - name: Download an explicitly selected verified build
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: carplay-captures
          path: CarPlay-Reuse
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Seed an example profile and capture CarPlay
        env:
          CARPLAY_CAPTURE_MODE: ${{ inputs.capture_mode }}
          CARPLAY_REUSE_DIR: ${{ inputs.reuse_run_id != '' && 'CarPlay-Reuse' || '' }}
          CARPLAY_REUSE_SHA256: ${{ inputs.reuse_sha256 }}
        run: bash scripts/carplay-capture/capture.sh
      - name: Preserve profile setup results
        if: always()
        run: |
          if [ -d CarPlaySetup.xcresult ]; then
            if [ ! -f CarPlay-Captures/Profile-Setup-Attachments/manifest.json ]; then
              xcrun xcresulttool export attachments --path CarPlaySetup.xcresult \
                --output-path CarPlay-Captures/Profile-Setup-Attachments
            fi
            xcrun xcresulttool get test-results summary --path CarPlaySetup.xcresult \
              > CarPlay-Captures/profile-test-summary.json
          fi
      - name: Preserve display diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carplay-captures
          path: CarPlay-Captures/
          retention-days: 7
          if-no-files-found: error
