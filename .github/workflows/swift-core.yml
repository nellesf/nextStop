name: Swift Core

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: NextStopCore (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.0'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint Swift formatting
        working-directory: ios/NextStopCore
        run: swift format lint --recursive --strict Package.swift Sources Tests

      - name: Run Swift tests
        working-directory: ios/NextStopCore
        run: swift test
