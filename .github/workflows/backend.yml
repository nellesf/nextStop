name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: nextstop_test
          POSTGRES_USER: nextstop_test
          POSTGRES_PASSWORD: nextstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstop_test -d nextstop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: PostGIS integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://nextstop_test:nextstop_test@127.0.0.1:5432/nextstop_test
        run: npm run test:integration
