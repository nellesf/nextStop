name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Lint, build, and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: nextstop_test
          POSTGRES_USER: nextstop_test
          POSTGRES_PASSWORD: nextstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstop_test -d nextstop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Validate rolling migration policy
        working-directory: backend
        run: npm run check:migrations

      - name: Release failure and promotion checks
        run: |
          python3 -m unittest discover -s deploy/releases -p 'test_*.py'
          python3 -m unittest discover -s deploy/gcp -p 'test_*.py'
          python3 -m unittest discover -s deploy/gcp-run -p 'test_*.py'
          python3 -m unittest discover -s deploy/security -p 'test_*.py'
          node --test ios/SimulatorAuthBroker/configuration.test.mjs

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: PostGIS integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://nextstop_test:nextstop_test@127.0.0.1:5432/nextstop_test
        run: npm run test:integration

  security:
    name: Dependency and container security gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit runtime and build dependencies (moderate or higher blocks)
        working-directory: backend
        run: |
          npm ci
          node --test ../deploy/security/gaxios-uuid.test.cjs
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
      - name: Build current runtime image
        run: docker build --pull --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag nextstop-security:$GITHUB_SHA backend
      - name: Scan OS and libraries (high or critical blocks, including unfixed)
        run: python3 deploy/security/scan-image.py --image nextstop-security:$GITHUB_SHA --commit "$GITHUB_SHA" --output security-results/image.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-${{ github.sha }}
          path: security-results/
          if-no-files-found: warn
