name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Lint, build, and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Validate rolling migration policy
        working-directory: backend
        run: npm run check:migrations

      - name: Release failure and promotion checks
        run: |
          python3 -m unittest discover -s deploy/releases -p 'test_*.py'
          python3 -m unittest discover -s deploy/gcp -p 'test_*.py'
          python3 -m unittest discover -s deploy/gcp-run -p 'test_*.py'
          python3 -m unittest discover -s deploy/security -p 'test_*.py'
          node --test ios/SimulatorAuthBroker/configuration.test.mjs

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build disposable PostGIS 3.6.4 with its upstream decoder security fix
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "nextstop-ci-postgis:$GITHUB_SHA" deploy/security/ci-postgis

      - name: Scan the test database image (all severities, including unfixed)
        run: |
          python3 deploy/security/scan-image.py --image "nextstop-ci-postgis:$GITHUB_SHA" \
            --commit "$GITHUB_SHA" --profile ci-postgis --output security-results/ci-postgis.json

      - name: Start the scanned database and exercise the native decoder
        run: |
          image=$(jq -er 'select(.passed == true) | .imageId' security-results/ci-postgis.json)
          docker run --detach --rm --name nextstop-ci-postgis --publish 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=nextstop_test -e POSTGRES_USER=nextstop_test \
            -e POSTGRES_PASSWORD=nextstop_test "$image"
          for attempt in {1..60}; do
            if docker exec nextstop-ci-postgis pg_isready -h 127.0.0.1 -U nextstop_test -d nextstop_test; then break; fi
            sleep 2
          done
          docker exec nextstop-ci-postgis pg_isready -h 127.0.0.1 -U nextstop_test -d nextstop_test
          docker exec nextstop-ci-postgis test ! -e /usr/local/bin/gosu
          docker exec -i nextstop-ci-postgis psql -X -v ON_ERROR_STOP=1 -U nextstop_test -d nextstop_test \
            < deploy/security/ci-postgis/check-decoder.sql

      - name: PostGIS integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://nextstop_test:nextstop_test@127.0.0.1:5432/nextstop_test
        run: npm run test:integration

      - name: Remove the disposable database
        if: always()
        run: docker rm -f -v nextstop-ci-postgis >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-postgis-security-${{ github.sha }}
          path: security-results/ci-postgis*.json
          if-no-files-found: warn

  security:
    name: Dependency and container security gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit runtime and build dependencies (moderate or higher blocks)
        working-directory: backend
        run: |
          npm ci
          node --test ../deploy/security/gaxios-uuid.test.cjs
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
      - name: Build current runtime image
        run: docker build --pull --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag nextstop-security:$GITHUB_SHA backend
      - name: Scan OS and libraries (high or critical blocks, including unfixed)
        run: python3 deploy/security/scan-image.py --image nextstop-security:$GITHUB_SHA --commit "$GITHUB_SHA" --output security-results/image.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-${{ github.sha }}
          path: security-results/
          if-no-files-found: warn
