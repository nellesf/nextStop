name: iOS App

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Tests to run
        type: choice
        options:
          - all
          - ui
          - screenshots
        default: all
      app_ref:
        description: Exact main commit to capture (screenshots only)
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test NextStopApp
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check out the app to capture
        if: inputs.test_scope == 'screenshots'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.app_ref }}
          path: screenshot-app

      - name: Install the capture harness without changing the app
        if: inputs.test_scope == 'screenshots'
        run: |
          cp ios/NextStopAppUITests/ProfileEditorUITests.swift \
            screenshot-app/ios/NextStopAppUITests/ProfileEditorUITests.swift
          git -C screenshot-app diff --exit-code -- \
            ios/NextStopApp ios/NextStopCore ios/NextStopCarPlay \
            ios/NextStop.xcodeproj ios/Config
          python3 - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', '-C', 'screenshot-app', *args], text=True).strip()
          with open('capture-source.json', 'w') as output:
              json.dump({
                  'appCommit': git('rev-parse', 'HEAD'),
                  'appTree': git('rev-parse', 'HEAD:ios/NextStopApp'),
                  'harnessCommit': os.environ['GITHUB_SHA'],
                  'runURL': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'data': 'Isolated in-memory profile with a city chosen through the app UI',
                  'device': 'iPhone 17 Pro',
                  'locale': 'de_DE',
              }, output, indent=2)
          PY

      - name: Prepare the screenshot simulator
        if: inputs.test_scope == 'screenshots'
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"] == "iPhone 17 Pro"))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl status_bar "$device_id" override \
            --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --batteryState charged --batteryLevel 100
          echo "SCREENSHOT_DEVICE_ID=$device_id" >> "$GITHUB_ENV"

      - name: Build and test iOS app
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: |
          set -o pipefail
          test_selection=(-skip-testing:NextStopAppUITests/ProfileEditorUITests/testWebsiteScreenshots)
          project=ios/NextStop.xcodeproj
          destination='platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          if [ "$TEST_SCOPE" = "ui" ]; then
            test_selection=(-only-testing:NextStopAppUITests -skip-testing:NextStopAppUITests/ProfileEditorUITests/testWebsiteScreenshots)
          elif [ "$TEST_SCOPE" = "screenshots" ]; then
            project=screenshot-app/ios/NextStop.xcodeproj
            destination="platform=iOS Simulator,id=$SCREENSHOT_DEVICE_ID"
            test_selection=(-only-testing:NextStopAppUITests/ProfileEditorUITests/testWebsiteScreenshots -parallel-testing-enabled NO)
          fi
          xcodebuild \
            -project "$project" \
            -scheme NextStopApp \
            -configuration Debug \
            -destination "$destination" \
            -resultBundlePath TestResults.xcresult \
            "${test_selection[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild.log

      - name: Publish Xcode diagnostics
        if: failure()
        run: |
          diagnostics="$(grep -E '(^|[[:space:]])(error:|fatal error:|Testing failed:)|Test Case .* failed' xcodebuild.log | tail -50 || true)"
          if [ -z "$diagnostics" ]; then
            diagnostics="Xcode failed without a compiler or test diagnostic in its text log."
          fi
          while IFS= read -r diagnostic; do
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Xcode diagnostic::$diagnostic"
          done <<< "$diagnostics"

      - name: Show failed test summary
        if: failure()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult
          fi

      - name: Archive Xcode test results
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            tar -czf TestResults.xcresult.tar.gz TestResults.xcresult
          fi

      - name: Export UI screenshots and attachments
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path UI-Attachments
            if [ -f capture-source.json ]; then
              cp capture-source.json UI-Attachments/
            fi
          fi

      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults.xcresult.tar.gz
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Upload UI screenshots and attachments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-attachments
          path: UI-Attachments/
          if-no-files-found: ignore
          retention-days: 7
